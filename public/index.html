<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JW Atlanta – Go-Back Punch</title>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Go-Back Punch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1c1b18;--mute:#6b6861;--line:#e2dfd8;--occ:#e0ddd5;--ready:#3b7ddd;--part:#fbd59a;--done:#3f9d5a;--done2:#2e7d44;--down:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light only}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:#faf9f6}
.who.empty{color:var(--down);border-color:var(--down)}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--mute)}
.bar{flex:1;height:8px;background:var(--occ);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.tools{display:flex;gap:8px;margin-top:8px;align-items:center}
.tools input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;background:#faf9f6}
.tools button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#faf9f6;font-size:13px;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:#faf9f6;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.banner{margin:10px 14px 0;padding:8px 12px;border-radius:9px;font-size:12.5px;background:#fff5d6;border:1px solid #efd58a;color:#6b4e00}
.banner.ok{background:#e6f4ea;border-color:#b8dfc3;color:#1f5c31}
.banner.hide{display:none}
main{padding:10px 14px 90px;max-width:1100px;margin:0 auto}
section.floor{margin-top:14px}
.fh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px 2px;flex-wrap:wrap}
.fh h2{font-size:15px;margin:0;white-space:nowrap}
.fh .n{font-size:12.5px;color:var(--mute)}
.fh .fn{font-size:12px;color:#8a6d00;flex-basis:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:7px}
.tile{position:relative;aspect-ratio:1/1;border-radius:9px;padding:4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .08s;border:1px solid rgba(0,0,0,.06)}
.tile:active{transform:scale(.94)}
.tile b{font-size:15px;display:block;line-height:1.1}
.tile small{font-size:10.5px;display:block;opacity:.8}
.tile.occ{background:var(--occ);color:#7a766d}
.tile.ready{background:var(--ready);color:#fff}
.tile.part{background:var(--part);color:#5a3a00}
.tile.part .ib{display:block;width:22px;height:14px;border-radius:4px;background:#fff;border:1.5px solid #e09a2b;font-size:9.5px;font-weight:700;line-height:12px;color:#8a5a00}
.tile.done{background:var(--done);color:#fff}
.tile.down::after{content:"2d";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;background:var(--down);color:#fff;border-radius:5px;padding:1px 4px}
.tile.corr{border:2px dashed rgba(0,0,0,.25)}
.tile.corr b{font-size:11.5px}
.tile.hid{display:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:12px 2px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.pub{margin-top:22px}.pub .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pub .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.pub .tile{aspect-ratio:auto;min-height:64px}.pub .tile b{font-size:12.5px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:20;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--card);border-radius:18px 18px 0 0;z-index:21;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{left:50%;right:auto;width:620px;transform:translate(-50%,100%)}.sheet.on{transform:translate(-50%,0)}}
.sh{padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.sh .t{flex:1}.sh h3{margin:0;font-size:20px}.sh .m{font-size:12.5px;color:var(--mute);margin-top:2px}
.sh .rn{font-size:12.5px;color:var(--down);font-weight:600;margin-top:3px}
.x{width:36px;height:36px;border-radius:50%;background:var(--occ);font-size:18px;line-height:36px;text-align:center}
.body{overflow-y:auto;padding:6px 10px 14px;-webkit-overflow-scrolling:touch}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:700;margin:12px 6px 4px}
.it{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.it:active{background:#f7f5f0}
.occrow{display:flex;align-items:center;justify-content:space-between;margin:10px 6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#faf9f6;font-weight:600;font-size:14px}
.sw{width:46px;height:26px;border-radius:13px;background:#cfcac0;position:relative;transition:background .15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:#7a766d}.sw.on::after{left:23px}
.sgn{font-size:12.5px;color:var(--done2);font-weight:600;margin-top:3px}
.cb{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #b5b0a5;margin-top:1px;position:relative}
.it.done .cb{background:var(--done);border-color:var(--done)}
.it.done .cb::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.it .tx{flex:1}.it .tx p{margin:0}
.it.done .tx p{color:var(--mute);text-decoration:line-through}
.it .nt{font-size:12px;color:#8a6d00;margin-top:2px}

.it .del{flex:none;color:var(--mute);font-size:18px;padding:0 4px;line-height:26px}
.acts{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.acts button{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:600;font-size:14px;background:#faf9f6}
.acts .pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.addrow{display:none;gap:8px;padding:0 12px 10px}.addrow.on{display:flex}
.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
.addrow button{border-radius:10px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:600}
.note{margin:10px 6px 0}.note textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit;font-size:14px;min-height:46px;resize:vertical;background:#faf9f6}
.empty{color:var(--mute);font-size:13.5px;padding:8px 6px;font-style:italic}
.dlg{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,18,14,.5);padding:20px}
.dlg.on{display:flex}
.dlg .box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.dlg h3{margin:0 0 6px;font-size:18px}.dlg p{margin:0 0 12px;color:var(--mute);font-size:13.5px}
.dlg input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:17px;text-transform:uppercase}
.dlg button{margin-top:12px;width:100%;flex:1;background:var(--ink);color:#fff;border-radius:10px;padding:12px;font-weight:600;font-size:15px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* ---- tabs & walk mode ---- */
.tabs{display:flex;gap:4px;background:var(--occ);border-radius:10px;padding:3px;margin-top:8px}
.tabs button{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.walk .prog,body.walk .tools,body.walk #chips,body.walk #main,body.walk #banner{display:none}
body:not(.walk) #walkRoot{display:none}
#walkRoot{padding:12px 14px 90px;max-width:1100px;margin:0 auto}
.wtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wtop h2{margin:0;font-size:17px;flex:1}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:600;font-size:13.5px;background:#faf9f6;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.grn{background:var(--done);color:#fff;border-color:var(--done)}
.btn.warn{background:#fff;color:var(--down);border-color:var(--down)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.wcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.wcard b{font-size:15px}.wcard .m{font-size:12.5px;color:var(--mute);margin-top:2px}
.wcard .st{float:right;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:#fff1d6;color:#7a5200}.wcard .st.closed{background:#e6f4ea;color:#1f5c31}
.wstats{font-size:12.5px;color:var(--mute);margin:-4px 0 8px}
.wsec{margin-top:16px}.wsec .fh{margin-bottom:6px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.wt{position:relative;min-height:66px;border-radius:10px;padding:8px 6px;text-align:left;background:var(--occ);color:#5d5a52;border:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;justify-content:space-between}
.wt b{font-size:13px;line-height:1.15;display:block}.wt small{font-size:11px;opacity:.85}
.wt.ok{background:var(--done);color:#fff}.wt.def{background:var(--part);color:#5a3a00}
.wt .cnt{position:absolute;top:6px;right:6px;background:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;color:#8a5a00;border:1px solid #e09a2b}
.wt .carry{position:absolute;bottom:6px;right:6px;font-size:10.5px;font-weight:700;background:#dfe6ee;color:#2b4a6b;border-radius:5px;padding:1px 5px}
.wt.add{background:#fff;border:2px dashed #c9c4b9;color:var(--mute);align-items:center;justify-content:center;text-align:center}
.wact{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.wact .btn{flex:1;text-align:center;text-decoration:none;color:inherit}
.drow{display:flex;gap:10px;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);align-items:flex-start}
.drow .sv{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 6px;border-radius:5px;background:#eee;margin-top:2px}
.sv.High{background:var(--down);color:#fff}.sv.Medium{background:#f6c453}.sv.Low{background:#dfe6ee}
.drow .tx{flex:1}.drow .tx p{margin:0;font-weight:600}.drow .meta{font-size:12px;color:var(--mute);margin-top:2px}
.drow.fixed .tx p{text-decoration:line-through;color:var(--mute)}.drow .fx{font-size:12px;color:var(--done2);font-weight:600}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.okrow{display:flex;align-items:center;justify-content:space-between;margin:10px 6px 4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#faf9f6;font-weight:600;font-size:14px}
.okrow.on{background:#e6f4ea;border-color:#b8dfc3;color:#1f5c31}
.frm{padding:4px 6px}.frm label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:700;margin:12px 0 5px}
.frm textarea,.frm input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#faf9f6}
.frm textarea{min-height:64px;resize:vertical}
.cchips{display:flex;flex-wrap:wrap;gap:6px}.cchips button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:#faf9f6;color:var(--mute)}
.cchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cchips button.on.High{background:var(--down);border-color:var(--down)}.cchips button.on.Medium{background:#e0a020;border-color:#e0a020}.cchips button.on.Low{background:#4a6a8a;border-color:#4a6a8a}
.phrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.phrow .pt{position:relative}.phrow img{width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.phrow .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;line-height:22px;text-align:center}
.phrow .cam{width:72px;height:72px;border-radius:9px;border:2px dashed #c9c4b9;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff}
.phrow .cam.busy{opacity:.5}
#dsheet{z-index:23}#dov{z-index:22}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}.viewer img{max-width:100%;max-height:100%}
.cosec{margin:12px 6px 0;border:1px dashed #b7c4d1;border-radius:10px;padding:8px 10px;background:#f4f7fa}
.cosec .grp{margin:0 0 4px;color:#2b4a6b}
.inrow{display:flex;gap:8px;margin:8px 0}.inrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
</style>
</head>
<body>
<header>
 <div class="top"><h1>JW Atlanta · <span id="ttl">Owner Go-Back Punch</span></h1></div>
 <div class="tabs"><button data-tab="punch" class="on">Go-Back Punch</button><button data-tab="walk">Weekly Walk</button></div>
 <div class="prog"><span id="pRooms">0 / 0 rooms</span><div class="bar"><i id="pBar"></i></div><span id="pItems">0 / 0 items</span></div>
 <div class="tools"><input id="q" type="search" inputmode="numeric" placeholder="Room # …" autocomplete="off"><button id="copy">Copy report</button></div>
 <div class="chips" id="chips">
  <button class="chip on" data-f="all">All</button><button class="chip" data-f="ready">Ready</button><button class="chip" data-f="part">Started</button><button class="chip" data-f="done">Signed off</button><button class="chip" data-f="occ">Occupied</button><button class="chip" data-f="down">Down rooms</button>
 </div>
</header>
<div class="banner" id="banner">Connecting to shared storage…</div>
<main id="main"></main>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
 <div class="sh"><div class="t"><h3 id="sTitle"></h3><div class="m" id="sMeta"></div><div class="rn" id="sNote"></div><div class="sgn" id="sSign"></div></div><button class="x" id="sClose">✕</button></div>
 <div class="body" id="sBody"></div>
 <div class="addrow" id="addrow"><input id="addTx" placeholder="Describe new defect…"><button id="addGo">Add</button></div>
 <div class="acts"><button id="bAdd">+ Add defect</button><button id="bAll" class="pri">Sign off room</button></div>
</div>
<div class="dlg" id="dlg"><div class="box"><h3>Sign off room</h3><p>Enter your initials to sign this room off as complete.</p><input id="dlgIn" maxlength="4" placeholder="e.g. AM"><button id="dlgGo">Sign off</button></div></div>
<div class="dlg" id="pindlg"><div class="box"><h3>Team PIN</h3><p>Enter the PIN to save sign-offs to the shared board.</p><input id="pinIn" inputmode="numeric" maxlength="12" placeholder="PIN"><button id="pinGo">Continue</button></div></div>

<div id="walkRoot"><div id="wList"></div><div id="wView"></div></div>
<div class="ov" id="aov"></div>
<div class="sheet" id="asheet">
 <div class="sh"><div class="t"><h3 id="aTitle"></h3><div class="m" id="aMeta"></div></div><button class="x" id="aClose">✕</button></div>
 <div class="body" id="aBody"></div>
 <div class="acts"><button id="aOk">✓ Looks good</button><button id="aAdd" class="pri">+ Defect</button></div>
</div>
<div class="ov" id="dov"></div>
<div class="sheet" id="dsheet">
 <div class="sh"><div class="t"><h3 id="dTitle">New defect</h3><div class="m" id="dMeta"></div></div><button class="x" id="dClose">✕</button></div>
 <div class="body"><div class="frm">
  <label>What's wrong</label><textarea id="dTx" placeholder="Describe the defect…"></textarea>
  <label>Where exactly (optional)</label><input type="text" id="dLoc" placeholder="e.g. outside 1017, left of entry">
  <label>Category</label><div class="cchips" id="dCat"></div>
  <label>Priority (optional)</label><div class="cchips" id="dSev"></div>
  <label>Department</label><div class="cchips" id="dDept"></div>
  <label>Photos</label><div class="phrow" id="dPh"></div>
  <input type="file" id="dFile" accept="image/*" capture="environment" multiple hidden>
 </div></div>
 <div class="acts" id="dActs"></div>
</div>
<div class="viewer" id="viewer"><img id="viewerImg" alt=""></div>
<div class="dlg" id="cdlg"><div class="box"><h3 id="cT"></h3><p id="cP"></p><div style="display:flex;gap:8px"><button id="cNo" style="background:#faf9f6;color:var(--ink);border:1px solid var(--line)">Cancel</button><button id="cYes" style="background:var(--down)">Delete</button></div></div></div>
<div class="dlg" id="gdlg"><div class="box"><h3 id="gT"></h3><p id="gP"></p><input id="gIn"><button id="gGo">OK</button></div></div>

 try{const r=await fetch('/api/state?since='+apiV,{cache:'no-store'});if(r.status===304)return;if(!r.ok)return;
  const j=await r.json();if(pending>0)return;apiV=j.v;const next={};for(const [k,b] of Object.entries(j.rooms||{}))next[k]=norm(b);state=next;render();if(openId)renderSheet();setBanner('')}

document.getElementById('aAdd').onclick=()=>openDefect(null);
async function fixCarry(d){if(!d)return;const by=await askText('Mark fixed','Your initials.','e.g. AM',who);if(!by)return;who=by.toUpperCase().slice(0,4);
 try{const ow=await (await wFetch('/api/walk/'+d.walkId)).json();const def=((ow.areas||{})[d.areaId]||{}).defects?.find(x=>x.id===d.id);if(!def)throw new Error('not found');def.fixed={by:who,at:new Date().toISOString()};
  await wFetch('/api/walk/'+ow.id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(ow)});await loadOpen();renderWalk();renderArea();toast('Marked fixed')}catch(e){toast('Could not update: '+e.message)}}
function viewPhoto(id){const v=document.getElementById('viewer');document.getElementById('viewerImg').src='/api/photo/'+id;v.classList.add('on')}
document.getElementById('viewer').onclick=e=>e.currentTarget.classList.remove('on');
// --- defect form
const dsheet=document.getElementById('dsheet'),dov=document.getElementById('dov');
let F={cat:'',sev:'',dept:'Engineering'};
function chips(el,list,cur,on,clearable){el.innerHTML=list.map(x=>`<button type="button" class="${x===cur?'on '+x.replace(/[^A-Za-z]/g,''):''}" data-v="${esc(x)}">${esc(x)}</button>`).join('');el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=clearable&&b.dataset.v===cur?'':b.dataset.v;on(v);chips(el,list,v,on,clearable)}}
function openDefect(i){const w=W.cur,id=W.area;const a=(w.areas||{})[id]||{defects:[]};const d=i==null?null:a.defects[i];W.edit=i;
 document.getElementById('dTitle').textContent=d?'Edit defect':'New defect';document.getElementById('dMeta').textContent=areaName(id);
 document.getElementById('dTx').value=d?d.t:'';document.getElementById('dLoc').value=d?d.loc||'':'';
 F={cat:d?d.cat||'Other':'Other',sev:d?d.sev||'':'',dept:d?d.dept||'Engineering':'Engineering'};W.photos=d?[...(d.photos||[])]:[];
 chips(document.getElementById('dCat'),CATS,F.cat,v=>F.cat=v);chips(document.getElementById('dSev'),SEVS,F.sev,v=>F.sev=v,true);chips(document.getElementById('dDept'),DEPTS,F.dept,v=>F.dept=v);
 renderPhotos();
 const closed=w.status==='closed';
 document.getElementById('dActs').innerHTML=(d?`<button class="btn warn" id="dDel">Delete</button><button class="btn ${d.fixed?'':'grn'}" id="dFix">${d.fixed?'Reopen':'✓ Mark fixed'}</button>`:'')+(closed&&d?'':`<button class="btn pri" id="dSave">${d?'Save changes':'Save defect'}</button>`);
 const sv=document.getElementById('dSave');if(sv)sv.onclick=saveDefect;
 const dl=document.getElementById('dDel');if(dl)dl.onclick=async()=>{if(!await askConfirm('Delete this defect?','"'+d.t+'" will be removed from this walk.','Delete'))return;a.defects.splice(i,1);await wSave();closeDefect();renderWalk();renderArea()};
 const fx=document.getElementById('dFix');if(fx)fx.onclick=async()=>{if(d.fixed){d.fixed=null}else{const by=await askText('Mark fixed','Your initials.','e.g. AM',who);if(!by)return;who=by.toUpperCase().slice(0,4);d.fixed={by:who,at:new Date().toISOString()}}await wSave();closeDefect();renderWalk();renderArea()};
 dsheet.classList.add('on');dov.classList.add('on');if(!d)setTimeout(()=>document.getElementById('dTx').focus(),200)}
function closeDefect(){dsheet.classList.remove('on');dov.classList.remove('on')}
dov.onclick=closeDefect;document.getElementById('dClose').onclick=closeDefect;
function renderPhotos(){const el=document.getElementById('dPh');el.innerHTML=W.photos.map(p=>`<span class="pt"><img src="/api/photo/${p}" data-view="${p}" alt=""><button type="button" class="rm" data-rm="${p}">✕</button></span>`).join('')+`<button type="button" class="cam ${W.busy?'busy':''}" id="dCam">${W.busy?'<span>Uploading…</span>':'<span style="font-size:22px">📷</span><span>Add photo</span>'}</button>`;
 el.onclick=e=>{const rm=e.target.closest('[data-rm]');if(rm){W.photos=W.photos.filter(p=>p!==rm.dataset.rm);renderPhotos();return}const v=e.target.closest('[data-view]');if(v){viewPhoto(v.dataset.view);return}if(e.target.closest('#dCam')&&!W.busy)document.getElementById('dFile').click()}}
document.getElementById('dFile').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;W.busy=true;renderPhotos();
 for(const f of files){try{const blob=await shrink(f);const r=await wFetch('/api/photo',{method:'POST',headers:{'content-type':'image/jpeg'},body:blob});const j=await r.json();W.photos.push(j.id)}catch(err){toast('Photo failed: '+err.message)}}
 W.busy=false;renderPhotos()};
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);const M=1280;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.72)};im.onerror=()=>rej(new Error('cannot read image'));im.src=url})}
async function saveDefect(){const t=document.getElementById('dTx').value.trim();if(!t){toast('Describe the defect first');return}const w=W.cur,id=W.area;w.areas=w.areas||{};w.areas[id]=w.areas[id]||{ok:false,defects:[]};const a=w.areas[id];a.defects=a.defects||[];
 if(W.edit==null){a.defects.push({id:'d'+Date.now().toString(36),t,loc:document.getElementById('dLoc').value.trim(),cat:F.cat,sev:F.sev,dept:F.dept,photos:[...W.photos],at:new Date().toISOString(),by:who||w.by,fixed:null})}
 else{const d=a.defects[W.edit];Object.assign(d,{t,loc:document.getElementById('dLoc').value.trim(),cat:F.cat,sev:F.sev,dept:F.dept,photos:[...W.photos]})}
 await wSave();closeDefect();renderWalk();renderArea()}
</script>
</body>
</html>
